<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f6e56">
<title>מחירון דירות — ראשון לציון</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.18);
    --tx:#1b1b19; --tx2:#6a6a64; --tx3:#9a9a93;
    --avail:#0f6e56; --avail-bg:#e1f5ee; --avail-bd:#1d9e75;
    --hold:#854f0b; --hold-bg:#faeeda; --hold-bd:#ef9f27;
    --sold:#a32d2d; --sold-bg:#fceaea; --sold-bd:#e24b4a;
    --none-tx:#777; --none-bg:#eeeeec; --none-bd:#cfcfca;
    --info:#185fa5; --info-bg:#e6f1fb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Hebrew",sans-serif;
    font-size:15px; line-height:1.5;}
  .wrap{max-width:560px; margin:0 auto; padding:12px 12px 40px;}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:10px;}
  .brand .logo-img{height:36px; width:auto; display:none;}
  .brand-davidson{font-family:Georgia,"Times New Roman",serif; font-size:20px; font-weight:500; letter-spacing:3px; color:var(--tx);}
  .brand-forever-chip{display:flex; align-items:center; background:#16302a; border-radius:10px; padding:6px 14px;}
  .brand-forever-chip .logo-img{height:30px;}
  .brand-forever{font-family:'Dancing Script',cursive; font-size:28px; line-height:1; color:#f0e6d6;}
  header{text-align:center; padding:2px 0 10px;}
  header h1{font-size:18px; font-weight:600; margin:0;}
  header .sub{font-size:12px; color:var(--tx2); margin-top:2px;}
  .seg{display:flex; gap:6px; margin-bottom:8px;}
  .seg:last-child{margin-bottom:0;}
  .seg button{flex:1; padding:8px 0; font-size:13px; font-family:inherit; color:var(--tx);
    background:#fff; border:1px solid var(--line); border-radius:9px; cursor:pointer;}
  .seg button.on{background:var(--info-bg); color:var(--info); border-color:#a9cdf0; font-weight:600;}
  .seg select,.seg input{flex:1; padding:8px 10px; font-size:13px; font-family:inherit; color:var(--tx);
    background:#fff; border:1px solid var(--line); border-radius:9px; min-width:0;}
  .vtoggle button{font-size:14px; padding:9px 0;}
  .grace-note{font-size:11px; color:var(--tx3); text-align:center; margin:-2px 0 8px;}
  .panel{background:#ececea; border-radius:14px; padding:10px; margin-bottom:10px;}
  .stats{display:flex; gap:6px; margin-bottom:10px;}
  .stat{flex:1; background:#ececea; border-radius:10px; padding:7px; text-align:center;}
  .stat .lbl{font-size:12px; color:var(--tx2);}
  .stat .num{font-size:19px; font-weight:600;}
  .legend{display:flex; gap:14px; justify-content:center; margin:6px 0 10px; font-size:12px; color:var(--tx2);}
  .legend i{font-size:13px; vertical-align:-1px;}
  /* list */
  .list{display:flex; flex-direction:column; gap:5px;}
  .row{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .row .head{padding:9px 11px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; border-right:3px solid var(--line2);}
  .row.avail .head{border-right-color:var(--avail-bd);}
  .row.hold .head{border-right-color:var(--hold-bd);}
  .row.sold .head{border-right-color:var(--sold-bd);}
  .ttl{font-size:15px; font-weight:600; line-height:1.3;}
  .meta{font-size:12px; color:var(--tx2);}
  .price{font-size:15px; font-weight:600; text-align:left; white-space:nowrap;}
  .price-cap{font-size:10px; color:var(--info); text-align:left; white-space:nowrap;}
  .price-base{font-size:11px; color:var(--tx2); text-align:left; white-space:nowrap;}
  .pill{display:inline-block; margin-top:2px; font-size:11px; padding:2px 9px; border-radius:7px;}
  .pill.avail{background:var(--avail-bg); color:var(--avail);}
  .pill.hold{background:var(--hold-bg); color:var(--hold);}
  .pill.sold{background:var(--sold-bg); color:var(--sold);}
  .pill.none{background:var(--none-bg); color:var(--none-tx);}
  .cap{display:inline-block; font-size:10px; padding:0 6px; border-radius:6px;
    background:var(--info-bg); color:var(--info); margin-right:5px; vertical-align:1px;}
  .det{background:#f6f6f4; border-top:1px solid var(--line); padding:9px 12px; font-size:13px;}
  .det .dr{display:flex; justify-content:space-between; padding:3px 0;}
  .det .dr span:first-child{color:var(--tx2);}
  .det .dr span:last-child{font-weight:600;}
  /* plan */
  .sel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .plan{border:1px solid var(--line2); border-radius:8px 8px 0 0; overflow:hidden;}
  .floor{display:flex; align-items:stretch;}
  .floor+.floor, .ftop{border-top:1px solid var(--line);}
  .flabel{flex:0 0 26px; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--tx2); background:#ececea;}
  .frow{flex:1; display:flex; gap:2px; padding:2px; min-width:0;}
  .ucell{flex:1; min-width:0; cursor:pointer; border-radius:4px; padding:4px 1px; text-align:center; line-height:1.15;}
  .ucell .sz{font-size:13px; font-weight:600;}
  .ucell .un{font-size:9px; opacity:.85;}
  .roof{height:9px; background:#e3e3df; border:1px solid var(--line2); border-top:none; border-radius:0 0 4px 4px;}
  .msg{text-align:center; color:var(--tx2); padding:24px 10px; font-size:14px; line-height:1.7;}
  .foot{text-align:center; color:var(--tx3); font-size:11px; margin-top:16px; line-height:1.6;}
  .banner{background:var(--hold-bg); color:var(--hold); border-radius:10px; padding:8px 11px;
    font-size:12px; margin-bottom:10px; text-align:center;}
  .refresh{display:block; margin:14px auto 0; padding:7px 16px; font-size:13px; font-family:inherit;
    background:#fff; border:1px solid var(--line); border-radius:9px; color:var(--tx); cursor:pointer;}
  .hide{display:none;}

  /* ---- בקשת הצטרפות ---- */
  .jr-open{width:100%; padding:8px 12px; font-family:inherit; font-size:13px; font-weight:600;
    background:var(--info-bg); color:var(--info); border:1px solid #a9cdf0; border-radius:9px; cursor:pointer;}
  .jr-open:active{transform:translateY(1px);}
  .jr-ov{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow:auto;}
  .jr-box{background:var(--card); border-radius:14px; padding:14px; width:100%; max-width:460px;
    margin:auto; box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .jr-head{display:flex; justify-content:space-between; align-items:center; font-size:16px; margin-bottom:8px;}
  .jr-x{background:none; border:none; font-size:17px; cursor:pointer; color:var(--tx3); font-family:inherit;}
  .jr-apt{background:var(--bg); border-radius:9px; padding:8px 10px; font-size:12px;
    color:var(--tx2); line-height:1.6; margin-bottom:10px;}
  .jr-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .jr-f{display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--tx2);}
  .jr-f input, .jr-f select{font-family:inherit; font-size:14px; padding:7px 9px; color:var(--tx);
    border:1px solid var(--line2); border-radius:8px; background:#fff; width:100%; box-sizing:border-box;}
  .jr-wide{margin-top:8px;}
  .jr-actions{margin-top:12px;}
  .jr-go{width:100%; padding:11px; font-family:inherit; font-size:15px; font-weight:600; color:#fff;
    background:var(--info); border:none; border-radius:10px; cursor:pointer;}
  .jr-msg{margin-top:9px; font-size:12.5px; line-height:1.6; text-align:center; color:var(--tx2);}
  .jr-msg.ok{color:#1d7a52;} .jr-msg.err{color:var(--sold);}
  @media (max-width:420px){ .jr-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div>
      <img class="logo-img" src="logo-davidson.png" alt="DAVIDSON" onload="this.style.display='inline';this.nextElementSibling.style.display='none';">
      <span class="brand-davidson">DAVIDSON</span>
    </div>
    <div class="brand-forever-chip">
      <img class="logo-img" src="logo-forever.png" alt="Forever" onload="this.style.display='inline';this.nextElementSibling.style.display='none';">
      <span class="brand-forever">Forever</span>
    </div>
  </div>
  <header>
    <h1>מחירון דירות — ראשון לציון</h1>
    <div class="sub" id="updated">טוען נתונים…</div>
  </header>

  <div id="banner"></div>

  <div class="seg vtoggle" id="viewSeg">
    <button data-v="plan" class="on">תרשים בניין</button>
    <button data-v="list">רשימה</button>
  </div>

  <div class="grace-note">בכל דירה: השורה העליונה — גרייס מלא, 25% הון עצמי מהסך הכולל · מתחתיה — האמדן · הדמיה, ריבית פריים משתנה</div>

  <!-- ============ תצוגת תרשים ============ -->
  <div id="planView">
    <div class="seg" id="planBldSeg">
      <button data-b="1" class="on">בוטיק 9 ק'</button>
      <button data-b="2">מגדל 20 ק'</button>
    </div>
    <div class="legend" style="flex-direction:column; gap:5px;">
      <div style="display:flex; gap:6px; align-items:center;">
        <span>פנוי — מילוי לפי גודל</span>
        <span id="sizeScale" style="display:inline-flex; height:11px; width:120px; border-radius:4px; overflow:hidden; border:1px solid var(--line);"></span>
        <span style="font-size:11px;">קטן→גדול</span>
      </div>
      <div style="display:flex; gap:14px; align-items:center;">
        <span><i class="ti ti-minus" style="color:var(--avail-bd)"></i> פנוי</span>
        <span><span style="display:inline-block;width:15px;height:15px;border:1px solid var(--hold-bd);border-radius:3px;vertical-align:-3px;background:linear-gradient(to top right,transparent 44%,var(--hold-bd) 44%,var(--hold-bd) 56%,transparent 56%),linear-gradient(to bottom right,transparent 44%,var(--hold-bd) 44%,var(--hold-bd) 56%,transparent 56%),var(--hold-bg);"></span> שמור</span>
        <span><span style="display:inline-block;width:15px;height:15px;border:1px solid var(--sold-bd);border-radius:3px;vertical-align:-3px;background:linear-gradient(to top right,transparent 44%,var(--sold-bd) 44%,var(--sold-bd) 56%,transparent 56%),linear-gradient(to bottom right,transparent 44%,var(--sold-bd) 44%,var(--sold-bd) 56%,transparent 56%),var(--sold-bg);"></span> נמכר</span>
      </div>
    </div>
    <div class="sel hide" id="sel"></div>
    <div id="plan"></div>
    <p class="foot">המספר בתא = שטח במ"ר · לחיצה על דירה לפרטים מלאים</p>
  </div>

  <!-- ============ תצוגת רשימה ============ -->
  <div id="listView" class="hide">
    <div class="panel">
      <div class="seg" id="listBldSeg">
        <button data-b="all" class="on">שני הבניינים</button>
        <button data-b="1">בוטיק 9 ק'</button>
        <button data-b="2">מגדל 20 ק'</button>
      </div>
      <div class="seg" id="statSeg">
        <button data-st="all" class="on">הכל</button>
        <button data-st="avail">פנוי</button>
        <button data-st="hold">שמור</button>
        <button data-st="sold">נמכר</button>
      </div>
      <div class="seg">
        <select id="rooms">
          <option value="all">כל החדרים</option>
          <option value="2">2 חדרים</option>
          <option value="3">3 חדרים</option>
          <option value="4">4 חדרים</option>
          <option value="5">5 חדרים</option>
        </select>
        <input id="q" placeholder="חיפוש מס' / טיפוס">
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="lbl">פנוי</div><div class="num" id="cAvail" style="color:var(--avail)">0</div></div>
      <div class="stat"><div class="lbl">שמור</div><div class="num" id="cHold" style="color:var(--hold)">0</div></div>
      <div class="stat"><div class="lbl">נמכר</div><div class="num" id="cSold" style="color:var(--sold)">0</div></div>
    </div>
    <div class="list" id="list"></div>
  </div>

  <button class="refresh" id="refreshBtn">רענון נתונים</button>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ============ הגדרות — ערוך כאן בלבד ============ */
/* הגיליון החדש (04.08.2026): טאב לכל בניין. השמות חייבים להתאים לשמות הטאבים בגיליון! */
var SHEET_ID = "1RBxcEXbuWlaP35MGpv4D8Qr5e3Y5QI2BeSGMScjo-Dc";
var SHEET_B  = "בוטיק 9 קומות";
var SHEET_T  = "מגדל 20 קומות";
var BUILDING1_NAME = "בוטיק 9 קומות";
var BUILDING2_NAME = "מגדל 20 ק'";
/* גרייס מלא: נקרא מעמודות הגיליון (מזהים 14.4/14.5); החישוב המקומי משמש כגיבוי בלבד */
var FIN = { prime: 4.5, margin: 1.0, eqPct: 25, m2c: 5, cm: 36 };

/* מיפוי לפי שורת "מזהה לקלוד" בכל טאב — לכל עמודה ID יציב, כך ששינוי/הוספת עמודות לא שובר.
   בוטיק: IDs 1..19 + 14.x  |  מגדל: IDs 101..119 + 115.x.  ערכי סטטוס: פנוי / שמור / נמכר */
var ID_ROW_LABEL = "מזהה";
var IDB1 = {floor:1, unit:2, type:3, dir:4, rooms:5, size:6, bal:7, pk:8,
            price:9, equity:10, law1:11, law2:12, taxS:13, taxI:14,
            buildCost:"14.01", landPrice:"14.1", landPct:"14.2", landBal:"14.3",
            graceT:"14.4", graceE:"14.5", status:15};
var IDB2 = {floor:101, ftype:102, unit:103, type:104, dir:105, rooms:106, size:107, bal:108, pk:109,
            price:110, equity:111, law1:112, law2:113, taxS:114, taxI:115,
            buildCost:"115.01", landPrice:"115.1", landPct:"115.2", landBal:"115.3",
            graceT:"115.4", graceE:"115.5", status:116};
/* גיבוי לפי מיקום קבוע בפריסת הטאבים החדשה (עמודה A = תווית), אם שורת המזהה חסרה */
var B1_FB = {floor:1, unit:2, type:3, dir:4, rooms:5, size:6, bal:7, pk:8, price:9, equity:10, law1:11, law2:12, taxS:13, taxI:14, buildCost:15, landPrice:16, landPct:17, landBal:18, graceT:19, graceE:20, status:21};
var B2_FB = {floor:1, ftype:2, unit:3, type:4, dir:5, rooms:6, size:7, bal:8, pk:9, price:10, equity:11, law1:12, law2:13, taxS:14, taxI:15, buildCost:16, landPrice:17, landPct:18, landBal:19, graceT:20, graceE:21, status:22};
/* ================================================ */

function gvizUrl(sheetName){
  return "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(sheetName);
}
var DATA = [], hasStatus=false;
var view="plan", planB=1, selId=null;
var listB="all", filter="all", open={};

/* ---------- פירוק הגיליון ---------- */
function parseCSV(text){
  var rows=[], row=[], cur="", q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch=='"') q=true; else if(ch==','){ row.push(cur); cur=""; }
      else if(ch=='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch=='\r'){} else cur+=ch; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function cell(r,i){ return (i!=null && r[i]!=null) ? String(r[i]).trim() : ""; }
function toNum(s){ var d=(s||"").replace(/[^\d]/g,""); return d?parseInt(d,10):0; }
function toPct(s){ var f=parseFloat((s||"").replace(/[^\d.]/g,"")); return isNaN(f)?0:f; }
function statusKey(s){
  s=(s||"").replace(/"/g,"").trim();
  if(s.indexOf("תפוס")>=0 || s.indexOf("נמכר")>=0) return "sold";
  if(s.indexOf("שמור")>=0 || s.indexOf("שריון")>=0) return "hold";
  if(s.indexOf("פנוי")>=0) return "avail";
  return null;
}
function extract(r, M, bldNum){
  var unit=cell(r,M.unit), price=toNum(cell(r,M.price));
  if(!/^\d+$/.test(unit) || price<100000) return null;
  var ft = M.ftype!=null ? cell(r,M.ftype) : "";
  return {
    bld:bldNum, floor:toNum(cell(r,M.floor)), unit:parseInt(unit,10),
    type:cell(r,M.type), dir:cell(r,M.dir), rooms:toNum(cell(r,M.rooms)),
    size:toNum(cell(r,M.size)), bal:toNum(cell(r,M.bal)), pk:toNum(cell(r,M.pk)),
    price:price, equity:toNum(cell(r,M.equity)), law1:toNum(cell(r,M.law1)),
    law2:toNum(cell(r,M.law2)), taxS:toNum(cell(r,M.taxS)), taxI:toNum(cell(r,M.taxI)),
    buildCost:toNum(cell(r,M.buildCost)),
    landPrice:toNum(cell(r,M.landPrice)), landPct:toPct(cell(r,M.landPct)), landBal:toNum(cell(r,M.landBal)),
    graceTv:toNum(cell(r,M.graceT)), graceEv:toNum(cell(r,M.graceE)),
    cap: ft.indexOf("קפסולה")>=0,
    status: M.status!=null ? statusKey(cell(r,M.status)) : null
  };
}
/* בונה id->עמודה משורת "מזהה לקלוד" */
function buildIdCol(rows){
  for(var i=0;i<rows.length;i++){
    if(cell(rows[i],0).indexOf(ID_ROW_LABEL)>=0){
      var map={};
      for(var j=0;j<rows[i].length;j++){ var v=cell(rows[i],j); if(/^\d+(\.\d+)?$/.test(v)) map[v.replace(/\.0+$/,"")]=j; }
      return map;
    }
  }
  return null;
}
function resolveMap(idMap, id2col){
  var m={}; for(var k in idMap){ var c=id2col[idMap[k]]; m[k]=(c==null?null:c); } return m;
}
function colsOk(m){ return m && m.unit!=null && m.price!=null; }
/* רזולוציה לפי כותרות — המזהים העשרוניים (14.1 וכו') מעוותים ע"י פורמט העמודה ב-CSV,
   ולכן השדות האלה נפתרים לפי טקסט הכותרת (ייחודי בכל טאב) */
var HDR_MATCH = {
  buildCost:{eq:"אמדן עלות הקמה"}, landPrice:{eq:"עלות קרקע"}, landPct:{has:"קרקע באחוזים"},
  landBal:{has:"השלמת קרקע"}, graceT:{has:"אמדן כולל ריבית"}, graceE:{has:"הון עצמי 25%"}
};
function buildHeaderMap(rows){
  for(var i=0;i<Math.min(rows.length,8);i++){
    var hasPrice=false, hasStatusH=false;
    for(var j=0;j<rows[i].length;j++){
      var v=cell(rows[i],j);
      if(v==="אמדן") hasPrice=true;
      if(v==="סטטוס") hasStatusH=true;
    }
    if(hasPrice && hasStatusH){
      var hm={};
      for(var k in HDR_MATCH){
        for(var j2=0;j2<rows[i].length;j2++){
          var h=cell(rows[i],j2);
          if(HDR_MATCH[k].eq ? h===HDR_MATCH[k].eq : (h && h.indexOf(HDR_MATCH[k].has)>=0)){ hm[k]=j2; break; }
        }
      }
      return hm;
    }
  }
  return {};
}
function parseSheetOne(text, idMap, fbMap, bldNum){
  var rows=parseCSV(text), out=[];
  var id2col=buildIdCol(rows);
  var m=id2col?resolveMap(idMap,id2col):null;
  if(!colsOk(m)) m={};
  for(var k in fbMap){ if(m[k]==null) m[k]=fbMap[k]; }
  var hm=buildHeaderMap(rows);
  for(var k2 in hm){ m[k2]=hm[k2]; }
  for(var i=0;i<rows.length;i++){
    var a=extract(rows[i],m,bldNum);
    if(a){ out.push(a); if(a.status) hasStatus=true; }
  }
  return out;
}

/* ---------- מסלול גרייס מלא: ריבית נצברת רבעונית ----------
   ההון העצמי (25%) נגזר מהסך הכולל (אמדן + ריבית), והריבית תלויה
   בהון העצמי (הלוואת הקרקע) — נפתר בנקודת-שבת: eq = 25% × (P + I(eq)) */
function graceIntWithEq(price, C, landStage, eq){
  var landLoan=Math.max(0,landStage-eq);
  var left=Math.max(0,eq-landStage);
  var q=(FIN.prime+FIN.margin)/100/4;
  var totalM=FIN.m2c+FIN.cm, quarters=Math.ceil(totalM/3), drawPM=C/FIN.cm;
  var bal=landLoan, tot=0;
  for(var k=1;k<=quarters;k++){
    var m1=(k-1)*3+1, m2=Math.min(k*3,totalM);
    var cmn=Math.max(0,m2-Math.max(m1,FIN.m2c+1)+1);
    var draws=cmn*drawPM;
    var off=Math.min(left,draws); draws-=off; left-=off;
    var it=(bal+draws)*q; tot+=it; bal+=draws+it;
  }
  return tot;
}
function graceCalc(d){
  /* עדיפות לערכים החיים מהגיליון (עמודות 14.4/14.5); חישוב מקומי רק אם חסרים */
  if(d.graceTv>0 && d.graceTv>d.price){
    var eqS=(d.graceEv>0)?d.graceEv:Math.round(d.graceTv*FIN.eqPct/100);
    return { total:Math.round(d.graceTv), interest:Math.round(d.graceTv-d.price), eq:eqS };
  }
  var P=d.price;
  var C=(d.buildCost>0 && d.buildCost<P)?d.buildCost:Math.round(P*0.433);
  var landStage=P-C;
  var eq=P*FIN.eqPct/100, I=0;
  for(var it=0; it<25; it++){
    I=graceIntWithEq(P,C,landStage,eq);
    var newEq=(P+I)*FIN.eqPct/100;
    if(Math.abs(newEq-eq)<1){ eq=newEq; break; }
    eq=newEq;
  }
  I=graceIntWithEq(P,C,landStage,eq);
  return { total:Math.round(P+I), interest:Math.round(I), eq:Math.round(eq) };
}
function priceBlock(d){
  var g=graceCalc(d);
  return '<div class="price-cap">גרייס מלא · 25% הון</div>'

    +'<div class="price-base">אמדן: '+nis(d.price)+'</div>';

/* ============ מנוע DOCX — בונה מסמך Word בדפדפן, בלי ספריות ============
   התבנית היא ZIP לא דחוס (method 0), ולכן צריך רק CRC32 וכתיבת כותרות ZIP —
   בלי inflate, בלי JSZip, בלי CompressionStream. עובד בכל דפדפן. */
var DocxFill = (function(){
  var CRC = (function(){ var t=new Uint32Array(256);
    for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
    return t; })();
  function crc32(b){ var c=0xFFFFFFFF; for(var i=0;i<b.length;i++) c=CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }

  /* הליכה סדרתית על כותרות מקומיות — תקף כי התבנית נבנתה כ-stored בלי data descriptors */
  function readZip(buf){
    var dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength), e=[], off=0;
    while(off+4<=buf.length && dv.getUint32(off,true)===0x04034b50){
      var method=dv.getUint16(off+8,true), csize=dv.getUint32(off+18,true);
      var nl=dv.getUint16(off+26,true), xl=dv.getUint16(off+28,true), ds=off+30+nl+xl;
      if(method!==0) throw new Error("התבנית חייבת להיות ZIP לא דחוס (נמצאה שיטה "+method+")");
      e.push({name:new TextDecoder("utf-8").decode(buf.subarray(off+30,off+30+nl)), data:buf.subarray(ds,ds+csize)});
      off=ds+csize;
    }
    if(!e.length) throw new Error("התבנית ריקה או פגומה");
    return e;
  }
  function writeZip(entries){
    var enc=new TextEncoder(), parts=[], central=[], offset=0;
    entries.forEach(function(e){
      var nb=enc.encode(e.name), crc=crc32(e.data), size=e.data.length;
      var lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
      lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
      lv.setUint16(8,0,true); lv.setUint16(12,0x21,true);
      lv.setUint32(14,crc,true); lv.setUint32(18,size,true); lv.setUint32(22,size,true);
      lv.setUint16(26,nb.length,true); lh.set(nb,30);
      var cd=new Uint8Array(46+nb.length), cv=new DataView(cd.buffer);
      cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
      cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(14,0x21,true);
      cv.setUint32(16,crc,true); cv.setUint32(20,size,true); cv.setUint32(24,size,true);
      cv.setUint16(28,nb.length,true); cv.setUint32(42,offset,true); cd.set(nb,46);
      parts.push(lh,e.data); central.push(cd); offset+=lh.length+size;
    });
    var cdSize=central.reduce(function(a,c){return a+c.length;},0);
    var eo=new Uint8Array(22), ev=new DataView(eo.buffer);
    ev.setUint32(0,0x06054b50,true); ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
    ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
    var out=new Uint8Array(offset+cdSize+22), p=0;
    parts.forEach(function(b){ out.set(b,p); p+=b.length; });
    central.forEach(function(b){ out.set(b,p); p+=b.length; });
    out.set(eo,p); return out;
  }

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function run(t){ return '<w:r><w:rPr><w:rtl/></w:rPr><w:t xml:space="preserve">'+esc(t)+'</w:t></w:r>'; }
  function fillCell(tc,t){ var i=tc.lastIndexOf("</w:p>"); return i<0?tc:tc.slice(0,i)+run(t)+tc.slice(i); }

  /* מיפוי לפי אינדקס תא. (0,1,9) מסומן "כיוון:" בטופס העדכני ולא ממולא — אין שדה מחסן. */
  function cellMap(d){ return [
    [0,0,1,d.bldg],[0,0,3,d.floor],[0,0,5,d.unit],[0,0,7,d.model],[0,0,9,d.dir],
    [0,1,1,d.rooms],[0,1,3,d.area],[0,1,5,d.balcony],[0,1,7,d.parking],
    [1,0,1,d.estimate],[1,0,3,d.equity],
    [2,0,1,d.b1name],[2,0,2,d.b2name],[2,1,1,d.b1id],[2,1,2,d.b2id],
    [2,2,1,d.address],[2,3,1,d.phone],[2,4,1,d.email]]; }

  function patch(xml,d){
    var bs=xml.indexOf("<w:body>"), be=xml.lastIndexOf("</w:body>");
    if(bs<0||be<0) throw new Error("לא נמצא גוף המסמך בתבנית");
    var body=xml.slice(bs,be), re=/<w:tbl>[\s\S]*?<\/w:tbl>/g, tbls=[], m;
    while((m=re.exec(body))) tbls.push({start:m.index,end:m.index+m[0].length,text:m[0]});
    if(tbls.length<3) throw new Error("התבנית מכילה "+tbls.length+" טבלאות במקום 3");
    var by={}; cellMap(d).forEach(function(x){ (by[x[0]]=by[x[0]]||[]).push([x[1],x[2],x[3]]); });
    for(var ti=tbls.length-1;ti>=0;ti--){
      if(!by[ti]) continue;
      var t=tbls[ti].text, rows=t.match(/<w:tr\b[\s\S]*?<\/w:tr>/g)||[], nr=rows.slice();
      by[ti].forEach(function(rc){
        var r=rc[0], c=rc[1], v=rc[2];
        if(v===""||v==null||!nr[r]) return;
        var cells=nr[r].match(/<w:tc>[\s\S]*?<\/w:tc>/g)||[];
        if(!cells[c]) return;
        var filled=fillCell(cells[c],v), seen=0;
        nr[r]=nr[r].replace(/<w:tc>[\s\S]*?<\/w:tc>/g,function(mm){ return (seen++===c)?filled:mm; });
      });
      rows.forEach(function(o,i){ t=t.replace(o,nr[i]); });
      body=body.slice(0,tbls[ti].start)+t+body.slice(tbls[ti].end);
    }
    if(d.date)       body=body.replace(/(<w:t[^>]*>)תאריך:_+(<\/w:t>)/,'$1תאריך: '+esc(d.date)+'$2');
    if(d.agent)      body=body.replace(/מנהל המכירות: _+/,'מנהל המכירות: '+esc(d.agent)+' ');
    if(d.agentPhone) body=body.replace(/טלפון נייד: _+/,'טלפון נייד: '+esc(d.agentPhone));
    return xml.slice(0,bs)+body+xml.slice(be);
  }

  return { fill:function(tplBytes,d){
    var entries=readZip(tplBytes);
    var doc=entries.filter(function(e){ return e.name==="word/document.xml"; })[0];
    if(!doc) throw new Error("לא נמצא word/document.xml בתבנית");
    doc.data=new TextEncoder().encode(patch(new TextDecoder("utf-8").decode(doc.data),d));
    return writeZip(entries);
  }};
})();

/* ================= בקשת הצטרפות — יצירת DOCX בדפדפן =================
   הדף טוען את תבנית ה-DOCX פעם אחת, מזריק את הערכים ומוריד קובץ חדש.
   אין שרת, אין Drive, אין הרשאות — ולכן גם אין עותק מרכזי:
   הקובץ נשמר רק במכשיר של מי שיצר אותו. */
var JR_TEMPLATE_URL = "assets/bakasha-template.docx";
var jrTpl = null;   // התבנית נטענת פעם אחת ונשמרת בזיכרון הדף

/* ---------- רישום לגוגל שיטס (דרך Google Form) ----------
   אין שרת, ולכן אין דרך לכתוב לגיליון עם אימות. Google Form היא נקודת קצה
   ציבורית שלא דורשת הרשאות, והתשובות זורמות אוטומטית לגיליון מקושר.
   הרישום הוא "שגר ושכח": הוא לעולם לא מעכב ולא שובר את יצירת המסמך.
   ריק = הרישום כבוי בשקט. */
var JR_LOG_URL   = "";   // .../formResponse
var JR_LOG_ENTRY = "";   // entry.XXXXXXXXX — שדה יחיד שמקבל שורה מופרדת בטאבים

function jrLog(row){
  if(!JR_LOG_URL || !JR_LOG_ENTRY) return;
  try{
    var body = new URLSearchParams();
    body.append(JR_LOG_ENTRY, row.join("\t"));
    /* no-cors + urlencoded = בקשה פשוטה בלי preflight. התשובה אטומה ולא נבדקת — במכוון. */
    fetch(JR_LOG_URL, { method:"POST", mode:"no-cors", body:body });
  }catch(e){ /* רישום שנכשל לא ישבש את הפקת המסמך */ }
}

    +'<button class="jr-open" onclick="jrOpen(\''+d.bld+'-'+d.unit+'\')">🧾 צור בקשת הצטרפות</button></div>';
}

function jrEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function jrGet(id){ var el=document.getElementById(id); return el?el.value.trim():""; }
function jrRemember(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function jrRecall(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }

function jrOpen(id){
  var d=DATA.filter(function(x){return x.bld+"-"+x.unit===id;})[0];
  if(!d) return;
  var bn=d.bld==1?BUILDING1_NAME:BUILDING2_NAME;
  var eq20=d.equity>0?d.equity:Math.round(d.price*0.2);
  var g=graceCalc(d);
  var f=function(lbl,fid,ph,val){
    return '<label class="jr-f"><span>'+lbl+'</span><input id="'+fid+'" placeholder="'+jrEsc(ph||"")+'" value="'+jrEsc(val||"")+'"></label>';
  };
  var html='<div class="jr-box" onclick="event.stopPropagation()">'
    +'<div class="jr-head"><b>בקשת הצטרפות</b><button class="jr-x" onclick="jrClose()">✕</button></div>'
    +'<div class="jr-apt">'+bn+' · דירה '+d.unit+' · קומה '+d.floor+' · '+d.rooms+' חד\' · '+d.size+' מ"ר · טיפוס '+d.type+' · '+d.dir+'<br>'
    +'אמדן: '+nis(d.price)+'</div>'
    +'<div class="jr-grid">'
    +f("שם רוכש א'","jr_b1name")+f("ת.ז. רוכש א'","jr_b1id")
    +f("שם רוכש ב'","jr_b2name","אם יש")+f("ת.ז. רוכש ב'","jr_b2id","אם יש")
    +f("כתובת","jr_address")+f("טלפון","jr_phone")
    +f('דוא"ל',"jr_email")
    +f("מנהל מכירות","jr_agent","",jrRecall("jr_agent"))
    +f("טלפון מנהל","jr_agentPhone","",jrRecall("jr_agentPhone"))
    +'</div>'
    +'<label class="jr-f jr-wide"><span>הון עצמי בטופס</span><select id="jr_eqmode">'
    +'<option value="std">20% מהאמדן — '+nis(eq20)+'</option>'
    +'<option value="grace">גרייס מלא 25% — '+nis(g.eq)+'</option></select></label>'
    +'<div class="jr-actions"><button class="jr-go" onclick="jrSubmit(\''+id+'\')">צור מסמך</button></div>'
    +'<div class="jr-msg" id="jr_msg"></div></div>';
  var ov=document.createElement("div");
  ov.className="jr-ov"; ov.id="jr_ov"; ov.innerHTML=html;
  ov.onclick=jrClose;
  document.body.appendChild(ov);
  var first=document.getElementById("jr_b1name"); if(first) first.focus();
}
function jrClose(){ var ov=document.getElementById("jr_ov"); if(ov) ov.parentNode.removeChild(ov); }

/* טוען את התבנית פעם אחת ומחזיק אותה בזיכרון הדף */
function jrLoadTemplate(){
  if(jrTpl) return Promise.resolve(jrTpl);
  return fetch(JR_TEMPLATE_URL,{cache:"force-cache"})
    .then(function(r){
      if(!r.ok) throw new Error("התבנית לא נמצאה ("+r.status+"). ודא ש-"+JR_TEMPLATE_URL+" קיים באתר.");
      return r.arrayBuffer();
    })
    .then(function(ab){ jrTpl=new Uint8Array(ab); return jrTpl; });
}

function jrToday(){
  var d=new Date(), p=function(n){ return (n<10?"0":"")+n; };
  return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear();
}
/* בתוך המסמך הסכום נכתב בכתיב עברי — "2,900,000 ₪" ולא "₪2,900,000" כמו בדף */
function jrMoney(n){ return n ? Math.round(n).toLocaleString("en-US")+" ₪" : ""; }

function jrSubmit(id){
  var d=DATA.filter(function(x){return x.bld+"-"+x.unit===id;})[0];
  var msg=document.getElementById("jr_msg");
  if(!d||!msg) return;
  if(!jrGet("jr_b1name")){ msg.className="jr-msg err"; msg.textContent="חובה למלא שם רוכש א'."; return; }

  jrRemember("jr_agent",jrGet("jr_agent")); jrRemember("jr_agentPhone",jrGet("jr_agentPhone"));
  msg.className="jr-msg"; msg.textContent="יוצר מסמך…";

  var eq20=d.equity>0?d.equity:Math.round(d.price*0.2);
  var eq = jrGet("jr_eqmode")==="grace" ? graceCalc(d).eq : eq20;
  var bn = d.bld==1?BUILDING1_NAME:BUILDING2_NAME;

  var data={
    date:jrToday(), bldg:bn, floor:d.floor, unit:d.unit, model:d.type, dir:d.dir,
    rooms:d.rooms, area:d.size?d.size+' מ"ר':"", balcony:d.bal?d.bal+' מ"ר':"", parking:d.pk,
    estimate:jrMoney(d.price), equity:jrMoney(eq),
    b1name:jrGet("jr_b1name"), b1id:jrGet("jr_b1id"),
    b2name:jrGet("jr_b2name"), b2id:jrGet("jr_b2id"),
    address:jrGet("jr_address"), phone:jrGet("jr_phone"), email:jrGet("jr_email"),
    agent:jrGet("jr_agent"), agentPhone:jrGet("jr_agentPhone")
  };
  var name=("בקשת הצטרפות - "+bn+" יחידה "+d.unit+" - "+data.b1name).replace(/[\\\/:*?"<>|]/g,"-")+".docx";

  jrLoadTemplate()
    .then(function(tpl){
      var bytes=DocxFill.fill(tpl,data);
      var blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },10000);
      msg.className="jr-msg ok";
      msg.innerHTML="✅ המסמך ירד למכשיר:<br>"+jrEsc(name);
      /* אחרי שהמסמך ירד בהצלחה — רישום. בלי ת.ז. ובלי דוא"ל: הם במסמך עצמו,
         והלוג נועד לעקוב אילו בקשות הופקו, לא לשכפל את פרטי הרוכש. */
      jrLog([ bn, d.unit, d.floor, d.rooms, d.size,
              d.price, eq, (jrGet("jr_eqmode")==="grace" ? "גרייס מלא 25%" : "20% מהאמדן"),
              data.b1name, data.b2name, data.phone, data.agent, name ]);
    })
    .catch(function(e){ msg.className="jr-msg err"; msg.textContent="שגיאה: "+e.message; });
}

function renderActive(){ if(view=="plan") renderPlan(); else renderList(); }

/* ---------- מתגים ---------- */
function bindSeg(segId,setter){
  document.getElementById(segId).addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    [].forEach.call(this.querySelectorAll("button"),function(x){x.classList.remove("on");});
    b.classList.add("on"); setter(b);
  });
}
bindSeg("viewSeg",function(b){
  view=b.getAttribute("data-v");
  document.getElementById("planView").className = view=="plan"?"":"hide";
  document.getElementById("listView").className = view=="list"?"":"hide";
  renderActive();
});
bindSeg("planBldSeg",function(b){ planB=+b.getAttribute("data-b"); selId=null; document.getElementById("sel").className="sel hide"; renderPlan(); });
bindSeg("listBldSeg",function(b){ listB=b.getAttribute("data-b"); renderList(); });
bindSeg("statSeg",function(b){ filter=b.getAttribute("data-st"); renderList(); });
document.getElementById("rooms").addEventListener("change",renderList);
document.getElementById("q").addEventListener("input",renderList);
document.getElementById("refreshBtn").addEventListener("click",load);

/* ---------- טעינה ---------- */
function load(){
  document.getElementById("updated").textContent="טוען נתונים…";
  var bust="&_="+(new Date().getTime());
  hasStatus=false;
  Promise.all([
    fetch(gvizUrl(SHEET_B)+bust).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status+" (בוטיק)"); return r.text(); }),
    fetch(gvizUrl(SHEET_T)+bust).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status+" (מגדל)"); return r.text(); })
  ])
    .then(function(texts){
      DATA=applyCapsules(parseSheetOne(texts[0],IDB1,B1_FB,1).concat(parseSheetOne(texts[1],IDB2,B2_FB,2)));
      if(!DATA.length) throw new Error("לא זוהו שורות דירה");
      SIZES=DATA.map(function(d){return d.size;}).filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
      buildSizeScale();
      var now=new Date();
      document.getElementById("updated").textContent="עודכן "+now.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})+" · "+DATA.length+" דירות";
      document.getElementById("banner").innerHTML = hasStatus ? "" :
        '<div class="banner">להצגת פנוי/שמור/נמכר — מלאו את עמודת הסטטוס בטאבי הבניינים בגיליון.</div>';
      document.getElementById("foot").innerHTML='נתונים חיים מתוך גיליון המחירון · צפייה בלבד<br>מסלול "גרייס מלא" נקרא מעמודות הגיליון (הדמיה, ריבית פריים משתנה)';
      renderActive();
    })
    .catch(function(e){
      document.getElementById("updated").textContent="שגיאה בטעינה";
      var m='<div class="msg">לא הצלחנו לטעון את הנתונים.<br>ודאו שהגיליון משותף כ"כל מי שיש לו הקישור — צופה".<br><small>'+e.message+'</small></div>';
      document.getElementById("plan").innerHTML=m; document.getElementById("list").innerHTML=m;
    });
}
load();
document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
</script>
