const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pwArg){
  const auto=pwArg!=null;
  const pw=auto?pwArg:document.getElementById('pw').value, err=document.getElementById('err');
  // שדה ריק אינו ניסיון סיסמה. בלי השורה הזו Enter על שדה ריק היה מפענח דף
  // שהוצפן בטעות במפתח ריק — קו ההגנה השני מול אותה תקלה של 31.08.2026.
  if(!pw){ if(!auto)err.textContent='נא להזין סיסמה'; return; }
  if(!auto)err.textContent='מפענח…';
  try{
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(IV)},key,dec(CT));
    const html=new TextDecoder().decode(pt);
    // cache so refresh doesn't re-prompt; localStorage too, so links that open a NEW TAB
    // (e.g. the dashboards' KB button) unlock without asking again (sessionStorage is per-tab)
    try{sessionStorage.setItem('dpw',pw);}catch(e){}
    try{localStorage.setItem('dpw',pw);}catch(e){}
    document.open();document.write(html);document.close();
    watchVersion(document);   // document.write replaced the document — re-attach the resume listeners
  }catch(e){ if(!auto) err.textContent='סיסמה שגויה'; /* auto-fail: fall through to the prompt; don't clear the cache — a wrong cached pw for THIS page may still be right for the page the user came from */ }
}
document.getElementById('go').onclick=()=>unlock();
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
// ---- stale-shell protection (23.08.2026) ----
// A home-screen shortcut has no address bar, so the user cannot append a cache-buster by hand.
// The button forces a fresh copy; the silent check below does it automatically when a newer
// build is live. Both use location.replace so the stale copy leaves the history stack.
const BUILD="0686093fd629";
function freshLoad(){location.replace(location.pathname+'?t='+Date.now());}
document.getElementById('rf').onclick=freshLoad;
// Runs on load AND on every resume. A home-screen shortcut usually RESTORES the last session
// rather than re-fetching, so a load-only check never fires for the very user who needs it most.
// The closure survives document.write (same JS realm), and the listeners are re-attached to the
// new document after the dashboard is written into it.
var _vLast=0,_vBusy=false;
function versionCheck(){
  var n=Date.now(); if(_vBusy||n-_vLast<20000)return; _vLast=n; _vBusy=true;
  try{
    fetch(location.pathname+'?v='+n,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      _vBusy=false;
      var m=t.match(/BUILD:([0-9a-f]{12})/);
      if(!m||m[1]===BUILD)return;                                  // already current
      var seen=null;try{seen=sessionStorage.getItem('vseen');}catch(e){}
      if(seen===m[1])return;                                       // already reloaded for this build — never loop
      try{sessionStorage.setItem('vseen',m[1]);}catch(e){}
      freshLoad();
    }).catch(function(){_vBusy=false;});
  }catch(e){_vBusy=false;}
}
function watchVersion(doc){
  try{doc.addEventListener('visibilitychange',function(){if(doc.visibilityState==='visible')versionCheck();});}catch(e){}
  try{window.addEventListener('pageshow',versionCheck);window.addEventListener('focus',versionCheck);}catch(e){}
  versionCheck();
}
watchVersion(document);
// auto-unlock from cached password (seamless refresh + cross-tab via localStorage)
try{var _s=sessionStorage.getItem('dpw')||localStorage.getItem('dpw');if(_s)unlock(_s);}catch(e){}
